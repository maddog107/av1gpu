# Serve photo.jpg.avif instead of photo.jpg to browsers that accept AVIF, keeping every existing URL.
# Generate the .avif files next to the originals, e.g. examples/encode_dir.sh uploads/ uploads/
#
# In the http {} block:
map $http_accept $avif_suffix {
    default        "";
    "~*image/avif" ".avif";
}

# In the server {} block (adjust the path pattern to your image location):
location ~* ^/uploads/.+\.(jpe?g|png|webp)$ {
    # caches must keep the AVIF and the original variant apart
    add_header Vary Accept;
    try_files $uri$avif_suffix $uri =404;
}

# nginx picks the Content-Type from the extension of the file it serves; make sure mime.types maps
# "avif" (recent versions do), otherwise add this line to it:
#   image/avif avif;
# If a CDN sits in front, it must vary its cache on Accept as well (or key on an AVIF-capable flag).
