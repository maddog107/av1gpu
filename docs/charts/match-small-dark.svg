<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Smallest files: av1gpu default vs libaom speed 6">
<title>Smallest files: av1gpu default vs libaom speed 6</title>
<rect x="0.5" y="0.5" width="759" height="267" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="24.0" y="34.0" font-size="17" fill="#f0efec" text-anchor="start" font-weight="600">Smallest files: av1gpu default vs libaom speed 6</text>
<text x="24.0" y="56.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400">100 photos of 0.18–24 MP on an AWS g6.4xlarge: libaom on all 16 vCPUs, av1gpu on one</text>
<text x="24.0" y="74.0" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="400">NVIDIA L4 and about 0.1 CPU core. Same file sizes, 4× the speed.</text>
<text x="250.0" y="114.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="600">Speed, MP/s  (higher is better)</text>
