<text x="250.0" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">0</text>
<line x1="294.0" y1="130.0" x2="294.0" y2="234.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="294.0" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">50</text>
<line x1="338.0" y1="130.0" x2="338.0" y2="234.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="338.0" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">100</text>
<line x1="382.0" y1="130.0" x2="382.0" y2="234.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="382.0" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">150</text>
<line x1="426.0" y1="130.0" x2="426.0" y2="234.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="426.0" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">200</text>
<line x1="470.0" y1="130.0" x2="470.0" y2="234.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="470.0" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">250</text>
<line x1="250.0" y1="130.0" x2="250.0" y2="234.0" stroke="#383835" stroke-width="1"/>
<text x="520.0" y="114.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="600">Files vs libaom speed 6  (lower is better)</text>
<line x1="520.0" y1="130.0" x2="520.0" y2="234.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="520.0" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">0</text>
<line x1="576.2" y1="130.0" x2="576.2" y2="234.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="576.2" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">5 %</text>
<line x1="632.5" y1="130.0" x2="632.5" y2="234.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="632.5" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">10 %</text>
<line x1="688.8" y1="130.0" x2="688.8" y2="234.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="688.8" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">15 %</text>
<line x1="520.0" y1="130.0" x2="520.0" y2="234.0" stroke="#383835" stroke-width="1"/>
<text x="24.0" y="149.0" font-size="14" fill="#f0efec" text-anchor="start" font-weight="600">av1gpu default</text>
<text x="24.0" y="167.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">1 GPU, 4 encoders</text>
<path d="M250.0,140.0 H348.1 Q352.1,140.0 352.1,144.0 V160.0 Q352.1,164.0 348.1,164.0 H250.0 Z" fill="#3987e5"/>
<text x="360.1" y="157.0" font-size="14" fill="#f0efec" text-anchor="start" font-weight="600">116</text>
<text x="528.0" y="157.0" font-size="14" fill="#f0efec" text-anchor="start" font-weight="600">−0.1 %</text>
<text x="24.0" y="205.0" font-size="14" fill="#f0efec" text-anchor="start" font-weight="400">libaom speed 6</text>
<text x="24.0" y="223.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">16 CPU threads at once</text>
