<svg xmlns="http://www.w3.org/2000/svg" width="760" height="454" viewBox="0 0 760 454" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Smallest files: av1gpu default vs libaom speed 6 and SVT-AV1">
<title>Smallest files: av1gpu default vs libaom speed 6 and SVT-AV1</title>
<rect x="0.5" y="0.5" width="759" height="453" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Smallest files: av1gpu default vs libaom speed 6 and SVT-AV1</text>
<text x="24.0" y="56.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">100 photos of 0.18–24 MP on an AWS g6.4xlarge: the CPU encoders on all 16 vCPUs, av1gpu</text>
<text x="24.0" y="74.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">on one NVIDIA L4 and about 0.3 CPU cores. Same file sizes as libaom speed 6, 8.0× the speed;</text>
<text x="24.0" y="92.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">SVT-AV1 reaches those sizes between its presets 4 and 6.</text>
<text x="250.0" y="132.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="600">Speed, MP/s  (higher is better)</text>
<line x1="250.0" y1="148.0" x2="250.0" y2="420.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="250.0" y="438.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">0</text>
<line x1="336.0" y1="148.0" x2="336.0" y2="420.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="336.0" y="438.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">50</text>
<line x1="422.0" y1="148.0" x2="422.0" y2="420.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="422.0" y="438.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">100</text>
<line x1="508.0" y1="148.0" x2="508.0" y2="420.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="508.0" y="438.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">150</text>
<line x1="594.0" y1="148.0" x2="594.0" y2="420.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="594.0" y="438.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">200</text>
<line x1="680.0" y1="148.0" x2="680.0" y2="420.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="680.0" y="438.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">250</text>
<line x1="250.0" y1="148.0" x2="250.0" y2="420.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="24.0" y="167.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">av1gpu default</text>
<text x="24.0" y="185.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">1 GPU, 4 encoders</text>
<path d="M250.0,158.0 H641.0 Q645.0,158.0 645.0,162.0 V178.0 Q645.0,182.0 641.0,182.0 H250.0 Z" fill="#2a78d6"/>
<text x="653.0" y="175.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">230</text>
<text x="24.0" y="223.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">libaom speed 6</text>
<text x="24.0" y="241.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">16 CPU threads at once</text>
<path d="M250.0,214.0 H295.5 Q299.5,214.0 299.5,218.0 V234.0 Q299.5,238.0 295.5,238.0 H250.0 Z" fill="#eb6834"/>
<text x="307.5" y="231.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">29</text>
<text x="24.0" y="279.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">SVT-AV1 preset 6</text>
<text x="24.0" y="297.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">16 CPU threads; files +2.1 %</text>
<path d="M250.0,270.0 H331.0 Q335.0,270.0 335.0,274.0 V290.0 Q335.0,294.0 331.0,294.0 H250.0 Z" fill="#008300"/>
<text x="343.0" y="287.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">49</text>
<text x="24.0" y="335.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">SVT-AV1 preset 4</text>
<text x="24.0" y="353.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">16 CPU threads; files −2.6 %</text>
<path d="M250.0,326.0 H272.7 Q276.7,326.0 276.7,330.0 V346.0 Q276.7,350.0 272.7,350.0 H250.0 Z" fill="#008300"/>
<text x="284.7" y="343.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">16</text>
<text x="24.0" y="391.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">NVENC AV1, p7</text>
<text x="24.0" y="409.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">same L4; files +30 %</text>
<path d="M250.0,382.0 H272.9 Q276.9,382.0 276.9,386.0 V402.0 Q276.9,406.0 272.9,406.0 H250.0 Z" fill="#e87ba4"/>
<text x="284.9" y="399.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">16</text>
