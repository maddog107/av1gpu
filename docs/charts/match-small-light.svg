<svg xmlns="http://www.w3.org/2000/svg" width="760" height="324" viewBox="0 0 760 324" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Smallest files: av1gpu default vs libaom speed 6">
<title>Smallest files: av1gpu default vs libaom speed 6</title>
<rect x="0.5" y="0.5" width="759" height="323" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Smallest files: av1gpu default vs libaom speed 6</text>
<text x="24.0" y="56.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">100 photos of 0.18–24 MP on an AWS g6.4xlarge: libaom on all 16 vCPUs, av1gpu on one</text>
<text x="24.0" y="74.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">NVIDIA L4 and about 0.1 CPU core. Same file sizes (within 0.1 %), 4× the speed.</text>
<text x="250.0" y="114.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="600">Speed, MP/s  (higher is better)</text>
<line x1="250.0" y1="130.0" x2="250.0" y2="290.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="250.0" y="308.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">0</text>
<line x1="321.7" y1="130.0" x2="321.7" y2="290.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="321.7" y="308.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">25</text>
<line x1="393.3" y1="130.0" x2="393.3" y2="290.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="393.3" y="308.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">50</text>
<line x1="465.0" y1="130.0" x2="465.0" y2="290.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="465.0" y="308.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">75</text>
<line x1="536.7" y1="130.0" x2="536.7" y2="290.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="536.7" y="308.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">100</text>
<line x1="608.3" y1="130.0" x2="608.3" y2="290.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="608.3" y="308.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">125</text>
<line x1="680.0" y1="130.0" x2="680.0" y2="290.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="680.0" y="308.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">150</text>
<line x1="250.0" y1="130.0" x2="250.0" y2="290.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="24.0" y="149.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">av1gpu default</text>
<text x="24.0" y="167.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">1 GPU, 4 encoders</text>
<path d="M250.0,140.0 H578.5 Q582.5,140.0 582.5,144.0 V160.0 Q582.5,164.0 578.5,164.0 H250.0 Z" fill="#2a78d6"/>
<text x="590.5" y="157.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">116</text>
<text x="24.0" y="205.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">libaom speed 6</text>
<text x="24.0" y="223.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">16 CPU threads at once</text>
<path d="M250.0,196.0 H328.4 Q332.4,196.0 332.4,200.0 V216.0 Q332.4,220.0 328.4,220.0 H250.0 Z" fill="#eb6834"/>
<text x="340.4" y="213.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">29</text>
<text x="24.0" y="261.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">NVENC AV1, p7</text>
<text x="24.0" y="279.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">same L4; files +30 %</text>
<path d="M250.0,252.0 H290.9 Q294.9,252.0 294.9,256.0 V272.0 Q294.9,276.0 290.9,276.0 H250.0 Z" fill="#e87ba4"/>
<text x="302.9" y="269.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">16</text>
</svg>
