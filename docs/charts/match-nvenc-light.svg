<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Same GPU: av1gpu vs the NVENC AV1 hardware encoder">
<title>Same GPU: av1gpu vs the NVENC AV1 hardware encoder</title>
<rect x="0.5" y="0.5" width="759" height="267" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Same GPU: av1gpu vs the NVENC AV1 hardware encoder</text>
<text x="24.0" y="56.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">The same photos through ffmpeg av1_nvenc (preset p7, tune uhq) on the same L4. NVENC is</text>
<text x="24.0" y="74.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">one fixed-function block; av1gpu runs on the CUDA cores, 7× faster with much smaller files.</text>
<text x="250.0" y="114.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="600">Speed, MP/s  (higher is better)</text>
