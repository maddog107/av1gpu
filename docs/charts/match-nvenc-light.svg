<text x="433.3" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">250</text>
<line x1="470.0" y1="130.0" x2="470.0" y2="234.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="470.0" y="252.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">300</text>
