name: CI

# pull requests and pushes to main; a branch without a pull request by hand (gh workflow run CI --ref <branch>)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to a pull request cancels its older run (main and manual runs each get their own group)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CPU parts + decoder fuzz test: random legal decision records must decode bit-exactly in dav1d and aomdec
  cpu-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build dav1d aom-tools
      - run: cmake -S . -B build -G Ninja -DAV1GPU_CUDA=OFF
      - run: cmake --build build
      - run: build/av1g_fuzz --seed 1 --count 1000 --quiet

  # the CUDA encoder must compile with the oldest and newest supported toolkits (no GPU on the runners); the CUDA
  # jobs compile through ccache (.github/actions/ccache), so a push that leaves a file alone gets its object from
  # the cache (pull requests from main's)
  cuda-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["nvidia/cuda:12.8.1-devel-ubuntu24.04", "nvidia/cuda:13.0.0-devel-ubuntu24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build pkg-config g++ curl \
            libjpeg-turbo8-dev libpng-dev libwebp-dev
      - uses: ./.github/actions/ccache
        with:
          key: ccache-${{ matrix.image }}-75-120-nvcc
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_CUDA_ARCHITECTURES="75;120" -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
      # -j 1: one k_recon translation unit (with CUDA 12.8, at 10 bits) and any other CUDA compile beside it
      # ran the 16 GB runner out of memory
      - run: cmake --build build -j 1
      # hits and misses; then only what this build used is kept (and saved)
      - run: ccache -sv && ccache --evict-older-than $(( $(date +%s) - CCACHE_T0 ))s
      - run: build/av1gpu --help

  # the CUDA encoder must also compile with Clang as the CUDA compiler: Clang 23 with CUDA 13.0 (13.2's CCCL
  # headers do not compile with Clang 23) and CMake 4.2 (3.28 cannot identify Clang with a CUDA 13 toolkit)
  clang-cuda-build:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.0.0-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates wget curl ninja-build pkg-config g++ \
            python3-pip libjpeg-turbo8-dev libpng-dev libwebp-dev
          wget -qO /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" > /etc/apt/sources.list.d/llvm-23.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y clang-23
          pip3 install --break-system-packages cmake==4.2.3
      - uses: ./.github/actions/ccache
        with:
          key: ccache-nvidia/cuda:13.0.0-devel-ubuntu24.04-75-120-clang23
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_CUDA_COMPILER=clang++-23 -DCMAKE_CUDA_ARCHITECTURES="75;120" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
      # Clang needs under 1 GB per k_recon translation unit (nvcc several GB); -j 1 as in cuda-build all the same
      - run: cmake --build build -j 1
      - run: ccache -sv && ccache --evict-older-than $(( $(date +%s) - CCACHE_T0 ))s
      - run: build/av1gpu --help

  # Windows x64: MSVC as the host compiler, CUDA from NVIDIA's redistributable archives, the image libraries
  # from vcpkg (tools/windows/build.ps1, as in the release); CUDA 12.9 for Turing and Blackwell, CUDA 13.4 for Turing
  # only (it compiles Blackwell code slowly; what changes on Windows with 13 is the toolkit's parts and CCCL needing
  # MSVC's conforming preprocessor)
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: "12.9.1"
            archs: "75;120"
          - cuda: "13.4.3"
            archs: "75"
    name: windows-build (CUDA ${{ matrix.cuda }})
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\build-deps\vcpkg-archives
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build-deps/vcpkg-archives
          key: vcpkg-x64-windows-static-${{ hashFiles('tools/windows/build.ps1') }}
          restore-keys: vcpkg-x64-windows-static-
      - uses: ./.github/actions/ccache
        with:
          key: ccache-windows-2022-cuda${{ matrix.cuda }}-${{ matrix.archs }}-msvc
      - run: ./tools/windows/build.ps1 -Archs "${{ matrix.archs }}" -CudaVersion ${{ matrix.cuda }} -Jobs 2 -Ccache
      - run: ccache -sv; ccache --evict-older-than "$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:CCACHE_T0)s"
      - run: build/av1gpu.exe --help
